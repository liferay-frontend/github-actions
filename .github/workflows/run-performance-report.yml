name: Run Performance Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1-5" 

permissions:
  pages: write
  contents: write
  id-token: write

env:
  ANT_OPTS: -Xmx2561m
  CREATE_BUNDLE_REPORTS: yes
  NODE_ENV: production

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up node 20.12.2
        uses: actions/setup-node@v4
        with:
          node-version: '20.12.2'

      - name: Configure git identity
        run: |
          # Configure git identity
          set -x

          git config --global user.email "liferay-frontend@liferay.com"
          git config --global user.name "Liferay Frontend User"


      - name: Sync liferay-portal repo
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          # Sync liferay-portal repo
          set -x

          gh repo sync liferay-frontend/liferay-portal \
            --source liferay/liferay-portal \
            --branch master


      - name: Checkout liferay-portal/master
        uses: actions/checkout@v4
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        with:
          path: 'liferay-portal'
          repository: 'liferay-frontend/liferay-portal'

      - name: Checkout github-actions/master
        uses: actions/checkout@v4
        with:
          path: 'github-actions'
          repository: 'liferay-frontend/github-actions'

      - name: Checkout github-actions/gh-pages
        uses: actions/checkout@v4
        with:
          path: 'gh-pages'
          ref: 'gh-pages'
          repository: 'liferay-frontend/github-actions'

      - name: Build portal
        run: |
          # Build portal
          set -x

          cd liferay-portal
          ant all


      - name: Generate reports
        run: |
          # Generate reports
          set -x

          cd liferay-portal/modules

          yarn node-scripts report:bundle:sizes
          yarn node-scripts report:bundle:sizes --with-internals
          yarn node-scripts report:bundle:imports
          yarn node-scripts report:source:imports
          yarn node-scripts report:java:imports


      - name: Copy Sonda.dev files
        run: |
          # Copy reports and Sonda.dev files
          set -x

          DATE=$(date --iso-8601)

          mapfile -t sonda_files < <(find liferay-portal -wholename '*/bundle-reports/*.html' | sort)

          mkdir -p gh-pages/runs/${DATE}/liferay-portal

          echo "
            <html>
            <head>
              <title>Sonda.dev files</title>
              <style>
                  a {
                    display: block;
                  }
                  body {
                    font-family: sans-serif;
                  }
              </style>
            </head>
            <body>
          " >gh-pages/runs/${DATE}/sonda-files.html

          for file in "${sonda_files[@]}"; do
            mkdir -p "gh-pages/runs/${DATE}/$(dirname "${file}")"
            cp -v "${file}" "gh-pages/runs/${DATE}/${file}"

            echo "<a href="${file}">${file}</a>" >> gh-pages/runs/${DATE}/sonda-files.html
          done

          echo "
            </body>
            </html>
          " >> gh-pages/runs/${DATE}/sonda-files.html

      - name: Generate report index page and publish
        run: |
          # Generate index page and publish
          set -x

          DATE=$(date --iso-8601)
          DATE_YESTERDAY=$(date --date="yesterday" --iso-8601)
          DATE_TOMORROW=$(date --date="tomorrow" --iso-8601)
          COMMIT=$(cd liferay-portal && git rev-parse HEAD)

          echo "
            <html>
            <head>
                <title>Reports for ${DATE} [${COMMIT}]</title>
                <style>
                  a {
                    display: block;
                  }
                  body {
                    font-family: sans-serif;
                  }
                  h2 {
                    border-top: 2px solid #222;
                    font-size: 1.2em;
                    padding-top: 0.2em;
                  }
                  pre {
                    font-size: 1.1em;
                  }
                </style>
            </head>
            <body>
                <div style="display:flex;">
                  <a href="/runs/${DATE_YESTERDAY}">Previous: ${DATE_YESTERDAY}</a> <span style="padding: 0 4px;">-</span> <a href="/runs/${DATE_TOMORROW}">Next: ${DATE_TOMORROW}</a>
                </div>

                <h2>Details of report:</h2>

                <div>
                  <b>Date:</b>
                  ${DATE}
                </div>
                <div>
                  <b>Commit SHA:</b>
                  ${COMMIT}
                </div>
                <a href="https://github.com/liferay/liferay-portal/tree/${COMMIT}">
                  Browse liferay-portal repository when this report was generated
                </a>


                <h2>Diff with previous build:</h2>

                <pre>$(node github-actions/difftool/difftool.mjs gh-pages/runs/${DATE_YESTERDAY} liferay-portal/modules)</pre>


                <h2>Resources:</h2>

                <a href="./sonda-files.html">
                  List of Sonda.dev files
                </a>
                <a href="https://github.com/liferay-frontend/github-actions/commits/gh-pages/">
                  List of previous report commits in gh-pages branch
                </a>
                <br>
                <a href="/runs/${DATE}/bundle-sizes.csv">bundle-sizes.csv</a>
                <a href="/runs/${DATE}/bundle-sizes-with-internals.csv">
                  bundle-sizes-with-internals.csv
                </a>
                <a href="/runs/${DATE}/bundle-imports.csv">bundle-imports.csv</a>
                <a href="/runs/${DATE}/source-imports.csv">source-imports.csv</a>
                <a href="/runs/${DATE}/java-imports.csv">java-imports.csv</a>
            </body>
            </html>
          " > gh-pages/runs/${DATE}/index.html

          cp -v liferay-portal/modules/*.csv gh-pages

          cd gh-pages
          git add .
          git commit -m "Reports for ${DATE} [${COMMIT}]"
          git push

      - name: Generate home index page and publish
        run: |
          # Generate index page and publish
          set -x
          echo "
            <html>
              <head>
                <title>Performance Reports</title>
                <style>
                  a {
                  display: block;
                  }
                  body {
                  font-family: sans-serif;
                  }
                  h2 {
                  border-top: 2px solid #222;
                  font-size: 1.2em;
                  padding-top: 0.2em;
                  }
                  pre {
                  font-size: 1.1em;
                  }
                </style>
              </head>
              <body><h2>Performance Reports</h2><ul>" > gh-pages/index.html

          for file in gh-pages/runs/*; do
            filename=$(basename "$file")
            echo "<li><a href=\"/runs/${filename}\">${filename}</a></li>" >> gh-pages/index.html
          done

          echo "</ul></body></html>" >> gh-pages/index.html

          cd gh-pages
          git add .
          git commit -m "Update index page ${DATE} [${COMMIT}]"
          git push
