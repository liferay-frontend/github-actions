name: Run Performance Report

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD Format'
        required: false
        type: string
  schedule:
    - cron: "0 7 * * *"

permissions:
  pages: write
  contents: write
  id-token: write

env:
  ANT_OPTS: -Xmx2561m
  CREATE_BUNDLE_REPORTS: yes
  NODE_ENV: production

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up node 20.12.2
        uses: actions/setup-node@v4
        with:
          node-version: '20.12.2'

      - name: Configure git identity
        run: |
          # Configure git identity
          set -x

          git config --global user.email "liferay-frontend@liferay.com"
          git config --global user.name "Liferay Frontend User"

      - name: Sync liferay-portal repo
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          # Sync liferay-portal repo
          set -x

          gh repo sync liferay-frontend/liferay-portal \
            --source liferay/liferay-portal \
            --branch master

      - name: Checkout liferay-portal (shallow)
        uses: actions/checkout@v4
        with:
          repository: liferay-frontend/liferay-portal
          ref: master
          path: liferay-portal-repo

      - name: Deepen history fully if date provided
        if: ${{ github.event.inputs.date != '' }}
        working-directory: liferay-portal-repo
        run: |
          git fetch origin master --shallow-since="${{ github.event.inputs.date }} - 7 days"

          # find exact commit by date (zero-time fallback to end-of-day)
          COMMIT=$(git rev-list -n 1 --before="${{ github.event.inputs.date }}" origin/master)

          echo "✅ Using exact commit: $COMMIT"
          git checkout "$COMMIT"

      - name: Build portal
        run: |
          # Build portal
          set -x

          cd liferay-portal-repo
          echo "Building portal at SHA: $(git rev-parse HEAD)"
          ant all

      - name: Generate reports
        run: |
          # Generate reports
          set -x

          cd liferay-portal-repo/modules

          yarn node-scripts report:bundle:sizes
          yarn node-scripts report:bundle:sizes --with-internals
          yarn node-scripts report:bundle:imports
          yarn node-scripts report:source:imports
          yarn node-scripts report:java:imports

      - name: Clear up space before cloning more repos
        run: |
          cd liferay-portal-repo
          rm -rf .git
          rm -rf .gradle

      - name: Checkout github-actions/master
        uses: actions/checkout@v4
        with:
          path: 'github-actions-repo'
          repository: 'liferay-frontend/github-actions'

      - name: Checkout github-actions/gh-pages
        uses: actions/checkout@v4
        with:
          path: 'gh-pages-repo'
          ref: 'gh-pages'
          repository: 'liferay-frontend/github-actions'

      - name: Checkout github-actions/gh-pages-data
        uses: actions/checkout@v4
        with:
          path: 'gh-pages-data'
          ref: 'gh-pages-data'
          repository: 'liferay-frontend/github-actions'

      - name: Copy Sonda.dev files
        run: |
          # Copy reports and Sonda.dev files
          set -x

          if [[ -n "${{ github.event.inputs.date }}" ]]; then
            DATE=${{ github.event.inputs.date }}
          else
            DATE=$(date --iso-8601)
          fi

          mapfile -t sonda_files < <(find liferay-portal-repo -wholename '*/bundle-reports/*.html' | sort)

          mkdir -p gh-pages-data/runs/${DATE}/liferay-portal

          echo "
            <html>
            <head>
              <title>Sonda.dev files</title>
              <style>
                  a {
                    display: block;
                  }
                  body {
                    font-family: sans-serif;
                  }
              </style>
            </head>
            <body>
              $(
                for file in ${sonda_files[@]}; do
                  mkdir -p "gh-pages-data/runs/${DATE}/$(dirname "${file}")"
                  cp "${file}" "gh-pages-data/runs/${DATE}/${file}"

                  echo "<a href='${file}'>${file}</a>"
                done
              )
            </body>
            </html>
          " > gh-pages-data/runs/${DATE}/sonda-files.html

      - name: Generate report index page and publish
        run: |
          # Generate index page and publish
          set -x

          if [[ -n "${{ github.event.inputs.date }}" ]]; then
            DATE="${{ github.event.inputs.date }}"
          else
            DATE="$(date --iso-8601)"
          fi

          DATE_YESTERDAY="$(date --date="$DATE -1 day" --iso-8601)"
          DATE_TOMORROW="$(date --date="$DATE +1 day" --iso-8601)"

          COMMIT="$(cd liferay-portal-repo && git rev-parse HEAD)"

          echo "
            <html>
            <head>
              <title>Reports for ${DATE} [${COMMIT}]</title>
              <style>
                a {
                  display: block;
                }
                body {
                  font-family: sans-serif;
                }
                h2 {
                  border-top: 2px solid #222;
                  font-size: 1.2em;
                  padding-top: 0.2em;
                }
                pre {
                  font-size: 1.1em;
                }
                .separator {
                  padding: 0 4px;
                }
                .flex {
                  display: flex;
                }
              </style>
            </head>
            <body>
              <div class='flex'>
                <a href='../../'>Home</a>
                <span class='separator'>-</span>
                <a href='../${DATE_YESTERDAY}'>
                  Previous: ${DATE_YESTERDAY}
                </a>
                <span class='separator'>-</span>
                <a href='../${DATE_TOMORROW}'>
                  Next: ${DATE_TOMORROW}
                </a>
              </div>

              <h2>Details of report:</h2>

              <div>
                <b>Date:</b> ${DATE}
              </div>
              <div>
                <b>Commit SHA:</b> ${COMMIT}
              </div>
              <a href='https://github.com/liferay/liferay-portal/tree/${COMMIT}'>
                Browse liferay-portal repository when this report was generated
              </a>

              <h2>Diff with previous build:</h2>

              <pre>$(node github-actions-repo/difftool/difftool.mjs gh-pages-data/runs/${DATE_YESTERDAY} liferay-portal-repo/modules)</pre>

              <h2>Resources:</h2>

              <a href='https://github.com/liferay-frontend/github-actions/tree/gh-pages-data/runs/${DATE}/sonda-files.html'>
                List of Sonda.dev files
              </a>
              <a href='https://github.com/liferay-frontend/github-actions/commits/gh-pages/'>
                List of previous report commits in gh-pages branch
              </a>
              <br>
              <a href='https://github.com/liferay-frontend/github-actions/tree/gh-pages-data/runs/${DATE}/bundle-sizes.csv'>bundle-sizes.csv</a>
              <a href='https://github.com/liferay-frontend/github-actions/tree/gh-pages-data/runs/${DATE}/bundle-sizes-with-internals.csv'>
                bundle-sizes-with-internals.csv
              </a>
              <a href='https://github.com/liferay-frontend/github-actions/tree/gh-pages-data/runs/${DATE}/bundle-imports.csv'>bundle-imports.csv</a>
              <a href='https://github.com/liferay-frontend/github-actions/tree/gh-pages-data/runs/${DATE}/source-imports.csv'>source-imports.csv</a>
              <a href='https://github.com/liferay-frontend/github-actions/tree/gh-pages-data/runs/${DATE}/java-imports.csv'>java-imports.csv</a>
            </body>
            </html>
          " > gh-pages-repo/runs/${DATE}/index.html

          cp -v liferay-portal-repo/modules/*.csv gh-pages-data/runs/${DATE}

          cd gh-pages-repo
          git add .
          git commit -m "Reports for ${DATE} [${COMMIT}]"
          git push

          cd ..

          cd gh-pages-data
          git add .
          git commit -m "Reports for ${DATE} [${COMMIT}]"
          git push

      - name: Generate home index page and publish
        run: |
          # Generate index page and publish
          set -x

          if [[ -n "${{ github.event.inputs.date }}" ]]; then
            DATE=${{ github.event.inputs.date }}
          else
            DATE=$(date --iso-8601)
          fi
          
          COMMIT="$(cd liferay-portal-repo && git rev-parse HEAD)"

          echo "
            <html>
            <head>
              <title>Performance Reports</title>
              <style>
                a {
                  display: block;
                }
                body {
                  font-family: sans-serif;
                }
                h2 {
                  border-top: 2px solid #222;
                  font-size: 1.2em;
                  padding-top: 0.2em;
                }
                pre {
                  font-size: 1.1em;
                }
              </style>
            </head>
            <body>
              <nav style='display:flex;gap:12px;'> 
                <a href='.'>All</a>
                <a href='./compare'>Compare</a>
              </nav>
              <h2>Performance Reports</h2>
              <ul>
                $(
                  mapfile -t files < <(ls gh-pages-repo/runs | sort -r)

                  for file in "${files[@]}"; do
                    filename="$(basename "$file")"

                    echo "
                      <li>
                        <a href='./runs/${filename}'>
                          ${filename}
                        </a>
                      </li>
                    " 
                  done
                )
              </ul>
            </body>
            </html>
          " > gh-pages-repo/index.html

          cd gh-pages-repo

          if [[ -n "$(git status --porcelain)" ]]; then
            git add .
            git commit -m "Update index page ${DATE} [${COMMIT}]"
            git push
          fi
