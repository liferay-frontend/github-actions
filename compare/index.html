<html>
	<head>
		<title>Compare</title>
		<style>
			a {
				display: block;
			}
			body {
				font-family: sans-serif;
			}
			h2 {
				border-top: 2px solid #222;
				font-size: 1.2em;
				padding-top: 0.2em;
			}
			pre {
				font-size: 1.1em;
			}
		</style>
	</head>
	<body>
		<h2>Compare</h2>
		
		<nav style="display:flex;gap:12px;">
			<a href="../">All</a>
			<a href=".">Compare</a>
		</nav>

		<br />

		<form>
			<label for="before">Before:</label>
			<input placeholder="2025-02-16" name="before" id="before" />
			<label for="after">After:</label>
			<input placeholder="2025-02-18" name="after" id="after" />

			<button id="compare">Compare</button>
		</form>

		<h2>Results:</h2>
		<div id="results" />

		<script type="module">
			function unquote(string) {
				if (string.startsWith('"')) {
					string = string.substring(1);
				}

				if (string.endsWith('"')) {
					string = string.substring(0, string.length - 1);
				}

				return string;
			}

			function formatSize(size) {
				if (size < 1_000) {
					return `${size}`;
				} else if (size < 1_000_000) {
					return `${(size / 1_000).toFixed(2)}K`;
				} else {
					return `${(size / 1_000_000).toFixed(2)}M`;
				}
			}

			async function getBundleSizes(date) {
				const sizes = {};

				const lines = await fetch(`../runs/${date}/bundle-sizes.csv`)
					.then((response) => {
						if (!response.ok) {
							document.getElementById(
								'results'
							).innerText = `🔴 Error: Data for date '${date}' not found, try another date.`;

							throw new Error(
								`HTTP Error! Status: ${response.status}`
							);
						}

						return response;
					})
					.then((response) => response.text())
					.then((text) => {
						return text.split('\n').slice(1).sort();
					});

				for (const line of lines) {
					let [bundle, _gzip, size] = line.split(';');

					bundle = unquote(bundle);
					size = unquote(size);

					sizes[bundle] = Number(size);
				}

				return sizes;
			}

			export async function compareBundleSizes(beforeDate, afterDate) {
				let retVal = '';
				const leftBundleSizes = await getBundleSizes(beforeDate);
				const rightBundleSizes = await getBundleSizes(afterDate);

				const added = Object.keys(rightBundleSizes)
					.filter((bundle) => !leftBundleSizes[bundle])
					.sort(
						(left, right) =>
							rightBundleSizes[right] - rightBundleSizes[left]
					);

				const removed = Object.keys(leftBundleSizes)
					.filter((bundle) => !rightBundleSizes[bundle])
					.sort(
						(left, right) =>
							leftBundleSizes[right] - leftBundleSizes[left]
					);

				const increased = Object.keys(leftBundleSizes)
					.filter(
						(bundle) =>
							rightBundleSizes[bundle] &&
							rightBundleSizes[bundle] > leftBundleSizes[bundle]
					)
					.sort(
						(left, right) =>
							rightBundleSizes[right] -
							leftBundleSizes[right] -
							(rightBundleSizes[left] - leftBundleSizes[left])
					);

				const decreased = Object.keys(leftBundleSizes)
					.filter(
						(bundle) =>
							rightBundleSizes[bundle] &&
							rightBundleSizes[bundle] < leftBundleSizes[bundle]
					)
					.sort(
						(left, right) =>
							leftBundleSizes[right] -
							rightBundleSizes[right] -
							(leftBundleSizes[left] - rightBundleSizes[left])
					);

				for (const bundle of added) {
					retVal += `+ 🔴 [${formatSize(
						rightBundleSizes[bundle]
					)}] ${bundle}\n`;
				}

				retVal += '\n';

				for (const bundle of increased) {
					retVal += `> 🔴 [${formatSize(
						leftBundleSizes[bundle]
					)} + ${formatSize(
						rightBundleSizes[bundle] - leftBundleSizes[bundle]
					)}] ${bundle}\n`;
				}

				retVal += '\n';

				for (const bundle of removed) {
					retVal += `- 🟢 [${formatSize(
						leftBundleSizes[bundle]
					)}] ${bundle}\n`;
				}

				retVal += '\n';

				for (const bundle of decreased) {
					retVal += `< 🟢 [${formatSize(
						leftBundleSizes[bundle]
					)} - ${formatSize(
						leftBundleSizes[bundle] - rightBundleSizes[bundle]
					)}] ${bundle}\n`;
				}

				const leftTotal = Object.values(leftBundleSizes).reduce(
					(total, size) => total + size,
					0
				);
				const rightTotal = Object.values(rightBundleSizes).reduce(
					(total, size) => total + size,
					0
				);

				const totalChange = rightTotal - leftTotal;

				retVal += '\n';

				if (totalChange < 0) {
					retVal += `< 🟢 [${formatSize(leftTotal)} - ${formatSize(
						Math.abs(totalChange)
					)}] ### TOTAL ###\n`;
				} else if (totalChange > 0) {
					retVal += `> 🔴 [${formatSize(leftTotal)} + ${formatSize(
						totalChange
					)}] ### TOTAL ###\n`;
				} else {
					retVal += `= ⚪️ [${formatSize(
						leftTotal
					)}] ### TOTAL ###\n`;
				}

				return retVal;
			}

			async function getResults() {
				const before = document.getElementById('before').value;
				const after = document.getElementById('after').value;

				const results = await compareBundleSizes(before, after);

				document.getElementById('results').innerText = results;
			}

			const urlParams = new URLSearchParams(window.location.search);

			const before = urlParams.get('before');
			const after = urlParams.get('after');

			document.getElementById('before').value = before || '';
			document.getElementById('after').value = after || '';

			if (before && after) {
				getResults();
			}
		</script>
	</body>
</html>
